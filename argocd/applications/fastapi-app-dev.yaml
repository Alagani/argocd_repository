apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fastapi-app-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Alagani/argocd_repository.git
    targetRevision: main
    path: apps/fastapi-app/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    # Dev auto-deploys on every merge — fast feedback, low blast radius.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
