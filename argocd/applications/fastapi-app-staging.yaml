apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fastapi-app-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Alagani/argocd_repository.git
    targetRevision: main
    path: apps/fastapi-app/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: fastapi-app-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
