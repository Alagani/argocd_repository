apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fastapi-app-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Alagani/argocd_repository.git
    targetRevision: main
    path: apps/fastapi-app/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    # Single fully-automated environment — CI opens the image-bump PR and
    # auto-merges it (see app_repository's ci.yml), and ArgoCD auto-syncs
    # the result. No developer click anywhere in the path.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
