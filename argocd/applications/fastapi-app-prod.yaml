apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fastapi-app-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Alagani/argocd_repository.git
    targetRevision: main
    path: apps/fastapi-app/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: fastapi-app-prod
  syncPolicy:
    # No automated block: prod promotion is a manual "argocd app sync" (or a
    # reviewed PR merge plus a manual click) — never auto-applied on merge.
    syncOptions:
      - CreateNamespace=true
