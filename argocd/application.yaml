apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fastapi-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Alagani/argocd_repository.git
    targetRevision: main
    path: apps/fastapi-app/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    # The two things worth pointing at for the demo:
    #   selfHeal: true  -> `kubectl edit`/`scale` the live Deployment and
    #                       watch ArgoCD revert it back to what's in git.
    #   prune: true     -> delete a resource from git and watch ArgoCD
    #                       delete it from the cluster too.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
