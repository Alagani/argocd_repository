apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo
resources:
  - ../../base
images:
  # Docker Hub repo, created manually (no IaC — see repo README). Unlike
  # ECR, Docker Hub has no image_tag_mutability=IMMUTABLE enforcement, so
  # newTag being a unique value every deploy (git sha) is a convention, not
  # a guarantee — never reuse a tag by hand.
  # newTag is bumped automatically by app_repository's CI (update-gitops
  # job), which opens and auto-merges a PR here after each image push —
  # see that repo's README. Everything after the merge (detecting the
  # change, applying it, keeping it applied) is ArgoCD.
  - name: fastapi-app
    newName: docker.io/jaga9989/myapp-repo
    newTag: 58f45de8be0cc645946b4bcda7adfacfa76b3bde
replicas:
  - name: fastapi-app
    count: 2
patches:
  # NodePort so the app is reachable at localhost:30080 (kind-config.yaml
  # maps that to localhost:8080) without a LoadBalancer/Ingress controller
  # (none provisioned in this demo).
  - target:
      kind: Service
      name: fastapi-app
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
