apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fastapi-app-prod
resources:
  - ../../base
images:
  - name: fastapi-app
    newName: ghcr.io/alagani/fastapi-app
    newTag: placeholder
replicas:
  - name: fastapi-app
    count: 3
patches:
  - target:
      kind: Deployment
      name: fastapi-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
